<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento en Tiempo Real - SoptraLoc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        body, html { margin:0; padding:0; height:100%; overflow:hidden; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
        .header { background:linear-gradient(135deg,#2C001E 0%,#772953 55%,#E95420 100%); color:white; padding:14px 20px; box-shadow:0 2px 10px rgba(0,0,0,.2); z-index:1000; }
        .header h1 { font-size:22px; margin:0; }
        .header .sub { font-size:12px; opacity:.85; }
        .container-fluid { display:flex; height:calc(100vh - 68px); padding:0; }
        .sidebar { width:400px; background:#fff; box-shadow:2px 0 10px rgba(0,0,0,.1); overflow-y:auto; padding:16px; transition:transform .3s ease; }
        @media (max-width:768px){ .sidebar{position:fixed;left:0;top:68px;bottom:0;z-index:999;transform:translateX(-100%);} .sidebar.visible{transform:translateX(0);} }
        .toggle-sidebar-btn { position:fixed; top:78px; left:10px; z-index:1001; background:#fff; border:none; padding:10px 15px; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.2); cursor:pointer; display:none; }
        @media (max-width:768px){ .toggle-sidebar-btn{display:block;} }
        .map-container { flex:1; position:relative; }
        #map { width:100%; height:100%; }
        .section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#772953; margin:14px 0 8px; border-bottom:1px solid #eee; padding-bottom:6px; }
        .stat-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
        .stat-chip { background:#f8f9fa; border:1px solid #eee; border-radius:20px; padding:4px 10px; font-size:12px; font-weight:600; }
        .stat-chip b { color:#E95420; }
        .service-item { background:#f8f9fa; border-radius:10px; padding:10px 12px; margin-bottom:10px; border-left:4px solid #6c757d; }
        .service-item.en-ruta { border-left-color:#0d6efd; }
        .service-item.asignado { border-left-color:#0dcaf0; }
        .service-item.entregado { border-left-color:#198754; }
        .service-item.programado { border-left-color:#6c757d; }
        .service-item.alerta { background:#fff3cd; border-left-color:#ffc107; }
        .service-item .svc-id { font-weight:700; font-size:14px; }
        .service-item .svc-meta { font-size:12px; color:#555; }
        .service-item .badge-eta { background:#0d6efd; color:#fff; border-radius:8px; padding:1px 8px; font-size:11px; font-weight:700; }
        .driver-item { background:#f8f9fa; border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; border:2px solid transparent; }
        .driver-item:hover { border-color:#E95420; }
        .driver-item .name { font-weight:700; font-size:13px; }
        .driver-item .meta { font-size:11px; color:#666; }
        .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
        .dot.on { background:#28a745; animation:pulse 2s infinite; }
        .dot.off { background:#dc3545; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
        .refresh-indicator { position:fixed; top:78px; right:16px; background:#fff; padding:6px 14px; border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.1); z-index:1000; font-size:12px; }
        .empty-note { text-align:center; color:#999; font-size:12px; padding:14px 0; }
        .mapboxgl-popup-content { padding:12px; border-radius:10px; font-size:13px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1><i class="fas fa-satellite-dish"></i> <span id="header-titulo">Seguimiento en Tiempo Real</span></h1>
                <div class="sub" id="header-fecha"></div>
                <div class="sub" id="header-sub"></div>
            </div>
            <div class="d-flex gap-2">
                <a id="btn-vista" href="/vista/" class="btn btn-light btn-sm"><i class="fas fa-clipboard-check"></i> Operación de Hoy</a>
                <a id="btn-operaciones" href="/operaciones/" class="btn btn-light btn-sm"><i class="fas fa-tasks"></i> Operaciones</a>
                <a id="btn-admin" href="/admin/" class="btn btn-light btn-sm"><i class="fas fa-cog"></i> Admin</a>
                <a id="btn-volver" href="/cliente/" class="btn btn-light btn-sm" style="display:none;"><i class="fas fa-store"></i> Volver al portal</a>
            </div>
        </div>
    </div>

    <div class="refresh-indicator" id="refresh-indicator"><i class="fas fa-sync-alt"></i> <span id="refresh-text">Actualizando...</span></div>
    <button class="toggle-sidebar-btn" id="toggle-sidebar-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <div class="container-fluid">
        <div class="sidebar" id="sidebar">
            <!-- Resumen del día -->
            <div class="section-title"><i class="fas fa-tachometer-alt"></i> Día en vivo</div>
            <div class="stat-chips" id="stat-chips"></div>

            <!-- Servicios del día -->
            <div class="section-title"><i class="fas fa-clipboard-list"></i> Servicios del día <span id="svc-count" class="badge bg-secondary"></span></div>
            <div id="services-list"><p class="empty-note">Cargando servicios…</p></div>

            <!-- Conductores (solo visión completa) -->
            <div id="conductores-section">
                <div class="section-title"><i class="fas fa-users"></i> Conductores</div>
                <div id="drivers-list"><p class="empty-note">Cargando conductores…</p></div>
            </div>
        </div>

        <div class="map-container"><div id="map"></div></div>
    </div>

    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <script>
function e(s){ return s==null?'':String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return e(s).replace(/"/g,'&quot;'); }

mapboxgl.accessToken = '{{ MAPBOX_PUBLIC_TOKEN|default_if_none:"" }}';
const map = new mapboxgl.Map({ container:'map', style:'mapbox://styles/mapbox/streets-v12', center:[-70.6483,-33.4569], zoom:10 });
map.addControl(new mapboxgl.NavigationControl());

// ---- FIX SEVERIDAD (Seba 04-oct-2026): las capas/markers se agregaban antes
// de que Mapbox terminara de cargar el estilo → 'Style is not done loading' y
// el mapa quedaba VACÍO (0 geocercas, 0 markers) aunque la sidebar mostrara
// 51 servicios. PEOR: la carrera fetch-vs-map hacia rendiciones parciales
// (markers solo si se llamaba renderServicesMap a mano). Ahora: bandera
// mapReady + sincronización en AMBOS eventos + reintento en cada refresh. ----
let mapReady = false;
function syncMapPaints(){
    if (!mapReady || !servicesLoaded) return false;
    drawGeocercas();
    if (CLIENTE_FILTRO) renderClientMap(); else { renderServicesMap(); updateMap(); }
    return true;
}
map.on('load', () => { mapReady = true; syncMapPaints(); });
let servicesLoaded = false;

// Modo cliente: /monitoring/?cliente=X → solo sus servicios; sin filtro → visión completa
const urlParams = new URLSearchParams(window.location.search);
const CLIENTE_FILTRO = (urlParams.get('cliente') || '').trim();

let markers = {};
let cdMarkers = {};
let selectedDriver = null;
let services = [];
let drivers = [];

const ESTADO_BADGE = {
    'por_arribar':'secondary','liberado':'secondary','secuenciado':'secondary',
    'programado':'secondary','asignado':'info','en_ruta':'primary',
    'entregado':'success','soltado':'success','descargado':'success',
    'vacio':'warning','vacio_en_ruta':'warning','en_patio':'warning','devuelto':'dark'
};

window.addEventListener('load', () => {
    document.getElementById('header-fecha').textContent = new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
    if (CLIENTE_FILTRO) {
        // Modo cliente: solo sus servicios, sin conductores ni resumen global
        document.getElementById('header-titulo').textContent = 'Mis Servicios';
        document.getElementById('header-sub').textContent = 'Cliente: ' + CLIENTE_FILTRO;
        const sec = document.getElementById('conductores-section');
        if (sec) sec.style.display = 'none';
        const btnOp = document.getElementById('btn-operaciones');
        if (btnOp) btnOp.style.display = 'none';
        const btnAdmin = document.getElementById('btn-admin');
        if (btnAdmin) btnAdmin.style.display = 'none';
        const btnVolver = document.getElementById('btn-volver');
        if (btnVolver) btnVolver.style.display = '';
    }
    refreshAll();
    // Polling cada 15s con Page Visibility API: si la pestaña esta oculta,
    // se pausa el refresco para no quemar ~40 req/min inútiles por usuario.
    let _pollTimer = null;
    function _startPoll() {
        if (_pollTimer) return;
        _pollTimer = setInterval(refreshAll, 15000);
    }
    function _stopPoll() {
        if (_pollTimer) {
            clearInterval(_pollTimer);
            _pollTimer = null;
        }
    }
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            _stopPoll();
        } else {
            refreshAll();  // refresco inmediato al volver
            _startPoll();
        }
    });
    _startPoll();
});

function refreshAll(){ loadServices(); if (!CLIENTE_FILTRO) loadDrivers(); drawGeocercas(); }

/* ---------- SERVICIOS EN EL MAPA DEL OPERADOR (Seba 04-oct-2026) ----------
   Antes los contenedores solo se veían en modo cliente (renderClientMap).
   Ahora en modo operador también se dibujan: marcador de caja en la geocerca
   del CD con su estado + ETA + conductor; si está en ruta, marcador de camión
   en la ULTIMA posición GPS reportada. Así el mapa nunca queda vacío. */
function renderServicesMap(){
    // quitar markers de servicios viejos (dejar solo los de drivers)
    Object.keys(markers).forEach(id=>{
        if(id.startsWith('svc-')){ markers[id].remove(); delete markers[id]; }
    });
    const drvById={}; drivers.forEach(d=>{ drvById[d.id]=d; });
    services.forEach(s=>{
        const estado=s.estado_container||'';
        let coords=null;
        let icono='<i class="fas fa-box" style="color:#0d6efd;font-size:20px;text-shadow:0 1px 2px rgba(0,0,0,.3);"></i>';
        // en ruta → dibujar en la posición GPS del conductor (movimiento real)
        if(estado==='en_ruta' && s.driver_id && drvById[s.driver_id]){
            coords=[drvById[s.driver_id].lng, drvById[s.driver_id].lat];
            icono='<i class="fas fa-truck" style="color:#E95420;font-size:24px;text-shadow:0 1px 3px rgba(0,0,0,.4);"></i>';
        } else if(s.cd_lat && s.cd_lng){
            coords=[Number(s.cd_lng), Number(s.cd_lat)];
        }
        if(!coords) return;
        const eta=s.eta_minutos!=null?` · ⏱️ ${Math.round(s.eta_minutos)} min`:(s.distancia_km!=null?` · 📏 ${s.distancia_km} km`:'');
        const horaProg=s.fecha_programada?new Date(s.fecha_programada).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):'';
        const pop=new mapboxgl.Popup({offset:25}).setHTML(
            `<strong>${e(s.container_id_formatted||s.container_id)}</strong><br>`+
            `<span class="badge bg-secondary">${e(estado||'—')}</span>${eta}<br>`+
            `🏭 ${e(s.cd_nombre||'—')} · 🕐 ${horaProg||'—'}<br>`+
            `${s.driver_nombre?`🚚 ${e(s.driver_nombre)} ${e(s.driver_patente||'')}`:'<span style="color:#d97706">⚠️ sin asignar</span>'}`
        );
        const el=document.createElement('div'); el.innerHTML=icono;
        markers['svc-'+s.id]=new mapboxgl.Marker(el).setLngLat(coords).setPopup(pop).addTo(map);
    });
    if(!selectedDriver){
        const b=new mapboxgl.LngLatBounds();
        services.forEach(s=>{ if(s.cd_lat&&s.cd_lng) b.extend([Number(s.cd_lng),Number(s.cd_lat)]); });
        drivers.forEach(d=>{ b.extend([d.lng,d.lat]); });
        if(!b.isEmpty()) map.fitBounds(b,{padding:60,maxZoom:13});
    }
}

// ---- Geocercas dibujadas: circulo por CD (radio en metros) ----
let geocercaSource = null;
function drawGeocercas(){
    if (!map.getSource('geocercas')) {
        map.addSource('geocercas', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
        map.addLayer({
            id:'geocercas-fill', type:'fill', source:'geocercas',
            paint:{ 'fill-color':'#5b8cff', 'fill-opacity':0.18, 'fill-outline-color':'#2563eb' },
            layout:{ visibility:'visible' }
        });
        map.addLayer({
            id:'geocercas-line', type:'line', source:'geocercas',
            paint:{ 'line-color':'#2563eb', 'line-width':3.0, 'line-opacity':0.95, 'line-dasharray':[2,1] }
        });
    }
    fetch('/api/cds/?activo=true')
        .then(r=>r.json())
        .then(d=>{
            const cds = (d.results||d||[]).filter(c=>c.lat && c.lng && c.geocerca_radio_m);
            const feat=cds.map(c=>{
                const lat=Number(c.lat), lng=Number(c.lng), r=Number(c.geocerca_radio_m);
                const coords=[];
                for(let i=0;i<48;i++){
                    const a=i/48*2*Math.PI;
                    const dLat=(r/111320), dLng=(r/(111320*Math.cos(lat*Math.PI/180)));
                    coords.push([lng+dLng*Math.cos(a), lat+dLat*Math.sin(a)]);
                }
                coords.push(coords[0]);
                return { type:'Feature',
                    properties:{ nombre:c.nombre, radio:Math.round(r)+' m', comuna:c.comuna||'', lat, lng },
                    geometry:{ type:'Polygon', coordinates:[coords] } };
            });
            map.getSource('geocercas').setData({ type:'FeatureCollection', features:feat });
            // Etiquetas con el nombre del CD en cada geocerca
            if (!map.getLayer('geocercas-label')) {
                map.addLayer({
                    id:'geocercas-label', type:'symbol', source:'geocercas',
                    layout:{
                        'text-field':['format',['get','nombre'],{'font-scale':0.7}],
                        'text-size':12,
                        'text-anchor':'bottom',
                        'text-offset':[0,-0.5],
                        'text-allow-overlap':false
                    },
                    paint:{ 'text-color':'#1e3a8a', 'text-halo-color':'#ffffff', 'text-halo-width':1.2 }
                });
            }
        })
        .catch(()=>{});
}

function updateRefresh(text){ document.getElementById('refresh-text').textContent = text; }

/* ---------- Servicios del día (por-dia: GMST + estado + ETA ML/Mapbox) ---------- */
function loadServices(){
    updateRefresh('Actualizando…');
    const fecha = new Date().toISOString().slice(0,10);
    const clienteQ = CLIENTE_FILTRO ? '&cliente=' + encodeURIComponent(CLIENTE_FILTRO) : '';
    fetch(`/api/programaciones/por-dia/?fecha=${fecha}${clienteQ}`)
        .then(r=>r.json())
        .then(d=>{ services = d.programaciones||[]; servicesLoaded = true; renderServices(); syncMapPaints(); updateRefresh(`Actualizado ${new Date().toLocaleTimeString()}`); })
        .catch(()=>{ document.getElementById('services-list').innerHTML='<p class="empty-note">Error cargando servicios</p>'; });
}

// Modo cliente: pintar sus servicios en el mapa (todas las programaciones, no solo en ruta)
function renderClientMap(){
    Object.keys(markers).forEach(id=>{ markers[id].remove(); delete markers[id]; });
    services.forEach(s=>{
        if (!(s.cd_lat && s.cd_lng)) return;
        const coords=[Number(s.cd_lng), Number(s.cd_lat)];
        const estado=s.estado_container||'';
        const el=document.createElement('div');
        el.innerHTML=estado==='en_ruta'
            ? '<i class="fas fa-truck" style="color:#E95420;font-size:22px;text-shadow:0 1px 3px rgba(0,0,0,.4);"></i>'
            : '<i class="fas fa-box" style="color:#0d6efd;font-size:20px;text-shadow:0 1px 2px rgba(0,0,0,.3);"></i>';
        const eta=s.eta_minutos!=null?` · ⏱️ ${Math.round(s.eta_minutos)} min`:'';
        const pop=new mapboxgl.Popup({offset:25}).setHTML(
            `<strong>${e(s.container_id_formatted||s.container_id)}</strong><br>`+
            `${e(s.estado_container||'')}${eta}<br>`+
            `${e(s.cd_nombre||'')}${s.driver_nombre?`<br>🚚 ${e(s.driver_nombre)}`:''}`
        );
        markers['svc-'+s.id]=new mapboxgl.Marker(el).setLngLat(coords).setPopup(pop).addTo(map);
    });
    const b=new mapboxgl.LngLatBounds();
    services.forEach(s=>{ if(s.cd_lat&&s.cd_lng) b.extend([Number(s.cd_lng),Number(s.cd_lat)]); });
    if(!b.isEmpty()) map.fitBounds(b,{padding:60,maxZoom:13});
}

function renderServices(){
    const cont = document.getElementById('services-list');
    document.getElementById('svc-count').textContent = services.length;

    const counts = {total:services.length, en_ruta:0, asignado:0, sin_asignar:0, alerta:0};
    services.forEach(s=>{
        if(s.estado_container==='en_ruta') counts.en_ruta++;
        if(s.estado_container==='asignado') counts.asignado++;
        if(!s.driver_nombre) counts.sin_asignar++;
        if(s.requiere_alerta) counts.alerta++;
    });
    document.getElementById('stat-chips').innerHTML =
        `<span class="stat-chip">📦 <b>${counts.total}</b> servicios</span>`+
        `<span class="stat-chip">🚚 <b>${counts.en_ruta}</b> en ruta</span>`+
        `<span class="stat-chip">👤 <b>${counts.asignado}</b> asignados</span>`+
        `<span class="stat-chip" style="${counts.sin_asignar?'background:#fff3cd':''}">⚠️ <b>${counts.sin_asignar}</b> sin asignar</span>`+
        `<span class="stat-chip" style="${counts.alerta?'background:#fff3cd':''}">🔔 <b>${counts.alerta}</b> alerta</span>`;

    if(!services.length){ cont.innerHTML='<p class="empty-note">Sin servicios programados para hoy</p>'; return; }

    // Calcular ETA estimado: prioridad ML híbrido (prediccion_ml) → eta_minutos → Mapbox distancia.
    const items = services.slice().sort((a,b)=>(a.fecha_programada||'').localeCompare(b.fecha_programada||''));
    cont.innerHTML = items.map(s=>{
        const hora = s.fecha_programada ? new Date(s.fecha_programada).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) : '—';
        const estado = s.estado_container||'';
        const cls = estado==='en_ruta'?'en-ruta':estado==='asignado'?'asignado':estado==='entregado'||estado==='soltado'||estado==='descargado'?'entregado':'';
        const alertaCls = s.requiere_alerta && !s.driver_nombre ? ' alerta' : '';
        const badge = ESTADO_BADGE[estado]||'secondary';

        let etaTxt = '';
        const pm = s.prediccion_ml;
        let etaMin = null;
        if (pm && pm.eta_minutos) {
            etaMin = pm.eta_minutos; etaTxt = `⏱️ ${Math.round(pm.eta_minutos)} min <small class="text-muted">(${pm.fuente||'ML'})</small>`;
        } else if (s.eta_minutos != null) {
            etaMin = s.eta_minutos; etaTxt = `⏱️ ${s.eta_minutos} min <small class="text-muted">(ML/Mapbox)</small>`;
        } else if (s.distancia_km != null) {
            etaTxt = `📏 ${s.distancia_km} km <small class="text-muted">(sin ETA)</small>`;
        }
        // Hora estimada de arribo (Seba 04-oct): fecha_programada + ETA → hora local
        let horaArribo = '';
        if (etaMin != null) {
            const base = s.fecha_inicio_ruta ? new Date(s.fecha_inicio_ruta) : new Date();
            const arr = new Date(base.getTime() + Number(etaMin)*60000);
            horaArribo = `🕐 Arribo ~${arr.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}`;
        }
        // Botón inicio de ruta MANUAL (Seba 04-oct): solo si asignado sin ruta
        let btnRuta = '';
        if(estado==='asignado' && s.driver_nombre && !s.fecha_inicio_ruta && !CLIENTE_FILTRO){
            btnRuta = `<button class="btn btn-sm btn-outline-light btn-iniciar-ruta mt-1" data-pid="${s.id}" data-did="${s.driver_id||''}" data-pat="${e(s.driver_patente||'')}" onclick="iniciarRutaManual(this)">🚦 Iniciar ruta</button>`;
        }

        return `
        <div class="service-item ${cls}${alertaCls}">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="svc-id">${e(s.container_id_formatted||s.container_id)}</span>
                    <span class="badge bg-${badge}" style="font-size:10px;">${e(estado)}</span>
                    ${s.requiere_alerta&&!s.driver_nombre?'<span class="badge bg-warning text-dark" style="font-size:10px;">⚠️ SIN ASIGNAR</span>':''}
                </div>
                <span class="badge-eta">${etaTxt||'—'}</span>
            </div>
            <div class="svc-meta mt-1">
                <i class="fas fa-clock"></i> ${hora} · <i class="fas fa-store"></i> ${e(s.cd_nombre||'—')}
                ${horaArribo?`<br><span class="text-success">${horaArribo}</span>`:''}
                <br>
                <i class="fas fa-user"></i> ${e(s.cliente||'—')}
                ${s.driver_nombre ? `<br><i class="fas fa-truck"></i> ${e(s.driver_nombre)} <span class="text-muted">(${e(s.driver_patente||'s/patente')})</span>` : ''}
                ${s.nivel_confianza?`<br><small class="text-muted">confianza ${s.nivel_confianza}% · ${e(s.clasificacion_sistema||'').replace(/_/g,' ')}</small>`:''}
                ${btnRuta}
            </div>
        </div>`;
    }).join('');
}

/* Inicio de ruta MANUAL desde el panel (Seba 04-oct-2026)
   POST /api/programaciones/{id}/iniciar_ruta/ con patente + GPS del conductor. */
function iniciarRutaManual(btn){
    const pid = btn.dataset.pid, pat = btn.dataset.pat;
    const did = btn.dataset.did;
    const drv = drivers.find(d=>String(d.id)===String(did));
    const lat = drv?drv.lat:-33.4569, lng = drv?drv.lng:-70.6483;
    btn.disabled = true; btn.textContent = 'Iniciando…';
    fetch(`/api/programaciones/${pid}/iniciar_ruta/`, {
        method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
        body: JSON.stringify({patente: pat, lat: lat, lng: lng})
    })
    .then(r=>r.json())
    .then(d=>{
        if(d.success){
            btn.textContent = '✅ Ruta iniciada'; btn.classList.add('disabled');
            setTimeout(refreshAll, 1500);
        } else {
            btn.disabled=false; btn.textContent = '🚦 Iniciar ruta';
            alert('⚠️ ' + (d.error||'No se pudo iniciar la ruta'));
        }
    })
    .catch(()=>{ btn.disabled=false; btn.textContent = '🚦 Iniciar ruta'; alert('Error de red'); });
}

/* ---------- Conductores en el mapa ---------- */
function loadDrivers(){
    fetch('/api/drivers/active_locations/')
        .then(r=>r.json())
        .then(data=>{ drivers=data; renderDrivers(); updateMap(); })
        .catch(()=>{});
}

function renderDrivers(){
    const cont = document.getElementById('drivers-list');
    if(!drivers.length){ cont.innerHTML='<p class="empty-note">No hay conductores activos</p>'; return; }
    cont.innerHTML = drivers.map(d=>{
        const min = Math.round((new Date()-new Date(d.ultima_actualizacion))/60000);
        const ok = min<30;
        // Antes: drivers.find(x=>x.id===d.id) buscaba en todo el array -> O(n²)
        // sobre docenas de conductores. Como d es el item actual del propio map(),
        // d.patente ya esta disponible y no requiere busqueda.
        return `<div class="driver-item" onclick="focusDriver(${d.id})">
            <div class="d-flex justify-content-between">
                <span class="name"><span class="dot ${ok?'on':'off'}"></span>${e(d.nombre)}</span>
                <span class="badge bg-light text-dark">${d.num_entregas_dia}/${d.max_entregas_dia}</span>
            </div>
            <div class="meta"><i class="fas fa-clock"></i> ${min<1?'Ahora':`Hace ${min} min`} · <i class="fas fa-truck"></i> ${e(d.patente||'')}</div>
        </div>`;
    }).join('');
}

function updateMap(){
    // Set de IDs activos para busqueda O(1) en lugar de O(n) por marker.
    const driverIds = new Set(drivers.map(d=>String(d.id)));
    Object.keys(markers).forEach(id=>{
        // NO borrar los markers de servicios (svc-*) — los gestiona renderServicesMap.
        if(id.startsWith('svc-')) return;
        if(!driverIds.has(id)){ markers[id].remove(); delete markers[id]; }
    });
    drivers.forEach(d=>{
        const coords=[d.lng,d.lat];
        if(markers[d.id]){ markers[d.id].setLngLat(coords); }
        else {
            const el=document.createElement('div');
            el.innerHTML='<i class="fas fa-truck" style="color:#E95420;font-size:24px;text-shadow:0 1px 3px rgba(0,0,0,.4);"></i>';
            const pop=new mapboxgl.Popup({offset:25}).setHTML(`<strong>${e(d.nombre)}</strong><br>Entregas: ${d.num_entregas_dia}/${d.max_entregas_dia}<br><small>${new Date(d.ultima_actualizacion).toLocaleTimeString()}</small>`);
            markers[d.id]=new mapboxgl.Marker(el).setLngLat(coords).setPopup(pop).addTo(map);
        }
    });
    if(drivers.length && !selectedDriver){
        const b=new mapboxgl.LngLatBounds();
        drivers.forEach(d=>b.extend([d.lng,d.lat]));
        services.forEach(s=>{ if(s.cd_lat&&s.cd_lng) b.extend([Number(s.cd_lng),Number(s.cd_lat)]); });
        if(!b.isEmpty()) map.fitBounds(b,{padding:60,maxZoom:13});
    }
}

function focusDriver(id){
    selectedDriver=id;
    if(markers[id]){ const c=markers[id].getLngLat(); map.flyTo({center:[c.lng,c.lat],zoom:13,essential:true}); markers[id].togglePopup(); }
    if(window.innerWidth<=768) toggleSidebar();
}

function toggleSidebar(){
    const s=document.getElementById('sidebar'), b=document.getElementById('toggle-sidebar-btn');
    s.classList.toggle('visible');
    b.innerHTML = s.classList.contains('visible') ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
}
</script>
