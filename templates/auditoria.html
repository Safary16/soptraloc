{% extends 'base.html' %}
{% load static %}

{% block title %}Auditoría - SoptraLoc{% endblock %}

{% block extra_css %}
<style>
    .audit-filter-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .audit-badge { font-size: .72rem; }
    table.audit-table td { vertical-align: middle; }
    #audit-results tbody tr:hover { background: #f8f9fa; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="fas fa-clipboard-list text-primary"></i> Auditoría de Eventos</h4>
        <span id="audit-count" class="badge bg-secondary"></span>
    </div>

    <div class="card audit-filter-card mb-3">
        <div class="card-body">
            <form id="audit-form" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small">Contenedor (ID)</label>
                    <input type="text" class="form-control form-control-sm" id="f-container" placeholder="ej: TEMU5801055">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Tipo de evento</label>
                    <select class="form-select form-select-sm" id="f-tipo">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Filtrar</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-reset">Limpiar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table audit-table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Fecha</th>
                        <th>Contenedor</th>
                        <th>Tipo</th>
                        <th>Usuario</th>
                        <th>Detalles</th>
                    </tr>
                </thead>
                <tbody id="audit-results">
                    <tr><td colspan="5" class="text-center text-muted py-4">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// Escape HTML (anti-XSS)
function e(s) {
    return s == null ? '' : String(s).replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
}

function fmtFecha(iso) {
    return iso ? new Date(iso).toLocaleString('es-CL', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
    }) : '—';
}

function fmtDetalles(det) {
    if (!det || Object.keys(det).length === 0) return '—';
    try {
        const texto = typeof det === 'string' ? det : JSON.stringify(det, null, 1);
        return '<pre class="mb-0" style="font-size:.72rem;max-height:90px;overflow:auto;white-space:pre-wrap;">' + e(texto) + '</pre>';
    } catch (err) {
        return e(String(det));
    }
}

function cargarTipos() {
    fetch('/api/auditoria/?limit=1')
        .then(r => r.json())
        .then(d => {
            const sel = document.getElementById('f-tipo');
            (d.event_types || []).forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.value;
                opt.textContent = t.label;
                sel.appendChild(opt);
            });
        })
        .catch(() => {});
}

function cargarEventos() {
    const params = new URLSearchParams({limit: 200});
    const c = document.getElementById('f-container').value.trim();
    const t = document.getElementById('f-tipo').value;
    if (c) params.set('container_id', c);
    if (t) params.set('event_type', t);

    fetch('/api/auditoria/?' + params.toString())
        .then(r => r.json())
        .then(d => {
            const tb = document.getElementById('audit-results');
            if (!d.success) {
                tb.innerHTML = '<tr><td colspan="5" class="text-center text-danger">' + e(d.error || 'Error') + '</td></tr>';
                return;
            }
            document.getElementById('audit-count').textContent = d.total + ' evento(s)';
            const eventos = d.eventos || [];
            if (eventos.length === 0) {
                tb.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Sin eventos para los filtros seleccionados.</td></tr>';
                return;
            }
            tb.innerHTML = eventos.map(ev => `
                <tr>
                    <td class="small">${fmtFecha(ev.created_at)}</td>
                    <td><strong>${e(ev.container_id || '')}</strong></td>
                    <td><span class="badge bg-primary audit-badge">${e(ev.event_type_display || ev.event_type)}</span></td>
                    <td class="small">${e(ev.usuario || 'system')}</td>
                    <td>${fmtDetalles(ev.detalles)}</td>
                </tr>
            `).join('');
        })
        .catch(() => {
            document.getElementById('audit-results').innerHTML =
                '<tr><td colspan="5" class="text-center text-danger">No se pudo cargar la auditoría.</td></tr>';
        });
}

document.addEventListener('DOMContentLoaded', function() {
    cargarTipos();
    cargarEventos();
    document.getElementById('audit-form').addEventListener('submit', function(ev) {
        ev.preventDefault();
        cargarEventos();
    });
    document.getElementById('btn-reset').addEventListener('click', function() {
        document.getElementById('f-container').value = '';
        document.getElementById('f-tipo').value = '';
        cargarEventos();
    });
});
</script>
{% endblock %}
