services:
  # Web Service
  - type: web
    name: soptraloc
    runtime: python
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Render FREE ya NO provisiona PostgreSQL: las DB free expiran y se borran
      # (~30 días; verificado: dpg-d9e1pj3rjlhs73bii2c0-a eliminada).
      # La base ahora es EXTERNA de free tier (Neon o Supabase). Pega su
      # connection string en Dashboard → Environment → DATABASE_URL.
      # sync:false = el Blueprint no la sobrescribe ni intenta crearla.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHONPATH
        value: "."
      - key: MAPBOX_API_KEY
        value: pk.eyJ1Ijoic2FmYXJ5MTYiLCJhIjoiY21naHlvYTQ5MDNlbDJrbjJjcXRtZGg1YSJ9.WCiyTSY_CCfB02N_Nfx7kg
      - key: DB_STARTUP_MAX_ATTEMPTS
        value: "12"
      - key: DB_STARTUP_RETRY_SECONDS
        value: "5"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@soptraloc.cl
      # PERIODO DE PRUEBAS: password genérica. Quitar DJANGO_SUPERUSER_ALLOW_WEAK
      # y poner una password >= 12 caracteres antes de producción.
      - key: DJANGO_SUPERUSER_ALLOW_WEAK
        value: "1"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "1234"
        sync: true

  # Procesa liberaciones cuya fecha/hora ya llegó. El comando es idempotente.
  - type: cron
    name: soptraloc-release-due
    runtime: python
    env: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "./build.sh"
    startCommand: "python manage.py release_due_containers"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Igual que el web service: DB externa, connection string manual.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          name: soptraloc
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: false

  # N2 (auditoría 2026-09-22): mantenimiento diario — reset num_entregas_dia,
  # purga de posiciones GPS >30d, archivado de notificaciones. Antes NO estaba
  # agendado en Render: cualquier fuga dejaba al conductor sin cupo para
  # siempre, sin auto-sanación diaria. 09:00 UTC = 06:00 Chile (GMT-3).
  - type: cron
    name: soptraloc-mantenimiento-diario
    runtime: python
    env: python
    plan: starter
    schedule: "0 9 * * *"
    buildCommand: "./build.sh"
    startCommand: "python manage.py render_maintenance"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        fromService:
          name: soptraloc
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: false

# ⚠️ El bloque databases se elimina a propósito: Render FREE ya no provisiona
# PostgreSQL (free expira a los 30 días). La DB es externa (Neon/Supabase) y
# llega vía env var DATABASE_URL configurada manualmente en el dashboard.