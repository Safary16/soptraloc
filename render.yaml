services:
  # Web Service
  - type: web
    name: soptraloc
    runtime: python
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: soptraloc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHONPATH
        value: "."
      - key: MAPBOX_API_KEY
        value: pk.eyJ1Ijoic2FmYXJ5MTYiLCJhIjoiY21naHlvYTQ5MDNlbDJrbjJjcXRtZGg1YSJ9.WCiyTSY_CCfB02N_Nfx7kg
      - key: DB_STARTUP_MAX_ATTEMPTS
        value: "12"
      - key: DB_STARTUP_RETRY_SECONDS
        value: "5"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@soptraloc.cl
      # PERIODO DE PRUEBAS: password genérica. Quitar DJANGO_SUPERUSER_ALLOW_WEAK
      # y poner una password >= 12 caracteres antes de producción.
      - key: DJANGO_SUPERUSER_ALLOW_WEAK
        value: "1"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "1234"
        sync: true

  # Procesa liberaciones cuya fecha/hora ya llegó. El comando es idempotente.
  - type: cron
    name: soptraloc-release-due
    runtime: python
    env: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "./build.sh"
    startCommand: "python manage.py release_due_containers"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: soptraloc-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: soptraloc
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: false

databases:
  - name: soptraloc-db
    databaseName: soptraloc
    user: soptraloc
    plan: free
